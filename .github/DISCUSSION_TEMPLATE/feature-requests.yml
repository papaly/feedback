title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Papaly! Please search existing discussions first and upvote if someone already requested this idea.

  - type: dropdown
    id: area
    attributes:
      label: Area of the app
      description: Which part of Papaly does this relate to?
      options:
        - Web App
        - Mobile / Responsive
        - Integrations & Sync
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or frustration that prompted this request.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this feature to work?
      placeholder: "Add an option to..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
      description: Optional screenshots, links, or workarounds you currently use.
    validations:
      required: false
