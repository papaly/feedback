title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please include enough detail so we can reproduce and fix it quickly.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser / Platform
      multiple: false
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Mobile Safari (iOS)
        - Mobile Chrome (Android)
        - Other
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page URL or App Version
      placeholder: "e.g., https://papaly.app/dashboard"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or error messages
      description: Paste any console errors or drag-and-drop screenshots here.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I searched existing bug reports to make sure this isn't a duplicate.
          required: true
